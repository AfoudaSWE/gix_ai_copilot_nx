# Release: validates, packs and consumer-tests every package, then (only when `publish` is
# true) publishes @gixcopilot/* to npm with provenance. See docs/RELEASING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version bump previewed (patch, minor, major, prerelease) or an exact version'
        required: true
        default: 'prerelease'
      publish:
        description: 'Publish the current package versions to npm'
        type: boolean
        default: false
      tag:
        description: 'npm dist-tag (latest or next)'
        required: true
        default: 'latest'
permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NX_DAEMON: 'false'
      REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '11.1.2' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.15.0', cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      # Without a token npm answers the first PUT with a misleading 404; fail fast instead.
      - name: Require the NPM_TOKEN secret when publishing
        if: ${{ inputs.publish }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set (npm automation or granular publish token for @gixcopilot)."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Validate everything
        run: pnpm exec nx run-many -t lint typecheck test build
      - name: Release candidate checks on packed artifacts
        run: |
          node tools/verify-packages.mjs --out .packs --keep
          node tools/consumer-test.mjs --packs .packs
      - name: Preview version
        run: pnpm exec nx release version ${{ inputs.specifier }} --dry-run
      - name: Publish to npm
        if: ${{ inputs.publish }}
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks --report-summary --tag ${{ inputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Upload publish summary
        if: ${{ always() && inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-publish-summary
          path: pnpm-publish-summary.json
          if-no-files-found: warn
      # A partial publish (some packages failed or were skipped) must fail the release, not
      # leave npm in a mixed state. Re-running this workflow is the recovery path: pnpm
      # skips versions already on the registry.
      - name: Verify every package is on npm at the local version
        if: ${{ inputs.publish }}
        run: node tools/check-npm-published.mjs --tag ${{ inputs.tag }}
